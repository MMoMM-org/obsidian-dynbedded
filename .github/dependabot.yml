version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      # chore: keeps dependency PRs out of the semantic-release version bump
      prefix: chore
    groups:
      # All deps here are devDependencies bundled out of the shipped plugin,
      # so batch them into one PR instead of one PR per package.
      dev-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns:
          - "*"
