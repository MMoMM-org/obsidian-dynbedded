version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      # chore: keeps dependency PRs out of the semantic-release version bump
      prefix: chore
    groups:
      # All deps here are devDependencies bundled out of the shipped plugin,
      # so batch them into one PR instead of one PR per package.
      dev-dependencies:
        patterns:
          - "*"
    ignore:
      # typescript-eslint (also pulled in by eslint-plugin-obsidianmd) pins its
      # TypeScript peer range (8.73: >=4.8.4 <6.1.0); a TS major bump breaks
      # `npm ci` with ERESOLVE, including in the Release workflow (PR #51).
      # Raise TypeScript by hand once typescript-eslint supports the new major.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns:
          - "*"
